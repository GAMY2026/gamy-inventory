<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#292929"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE49A"/>
      <stop offset="50%" stop-color="#D4A83A"/>
      <stop offset="100%" stop-color="#9A6A12"/>
    </linearGradient>
  </defs>

  <!-- خلفية الأيقونة -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- الإطار -->
  <rect x="9" y="9" width="82" height="82" rx="20"
        fill="none"
        stroke="url(#gold)"
        stroke-width="3"/>

  <!-- شكل صندوق المخزون -->
  <path d="M20 34 L50 19 L80 34 L50 49 Z"
        fill="none"
        stroke="url(#gold)"
        stroke-width="4"
        stroke-linejoin="round"/>

  <path d="M20 34 V67 L50 82 L80 67 V34"
        fill="none"
        stroke="url(#gold)"
        stroke-width="4"
        stroke-linejoin="round"/>

  <path d="M50 49 V82"
        stroke="url(#gold)"
        stroke-width="4"/>

  <!-- حرف G -->
  <text x="50" y="68"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="30"
        font-weight="900"
        fill="#FFFFFF">G</text>
</svg>
